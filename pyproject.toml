[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-converter"
version = "1.0.0"
description = "Simple scripts to convert files between different formats"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Evan"}
]
keywords = [
    "file-conversion",
    "pdf",
    "markdown",
    "jupyter",
    "ocr",
    "openai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

dependencies = [
    # Web UI (local FastAPI server behind the TypeScript frontend)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",  # FastAPI needs it for file uploads, nothing imports it

    # LLM providers
    "openai>=2.7.1",
    "anthropic>=1.0",
    "vision-parse>=0.1.13",
    "python-dotenv>=1.1.1",

    # PDF Generation & Manipulation
    "reportlab>=4.4.4",
    "pypdf>=6.0.0",
    "pymupdf>=1.26.4",
    "pymupdf4llm>=0.0.17",

    # Document Processing
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "mistune>=3.0,<4",  # md_toon.py parses Markdown tables with it, nbconvert pulls it in too

    # Image Processing
    "pillow>=11.3.0",
    "pillow-heif>=0.22.0",
    "pytesseract>=0.3.13",
    "opencv-python>=4.12.0.88",
    "vtracer>=0.6.15",

    # Data Processing
    "pandas>=2.2.3",
    "numpy>=2.2.5",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.5",  # csv_xlsx.py picks it as the pandas engine, nothing imports it
    "toon-format>=1.2.0",

    # Jupyter Notebooks
    "nbconvert>=7.16.6",  # ipynb_pdf.py runs `jupyter nbconvert`, nothing imports it

    # Utilities
    "python-magic>=0.4.27",
    "requests>=2.32.3",
    "tqdm>=4.67.1",

    # Speech to text (mp4_md.py)
    "faster-whisper>=1.2.1",
    "av<19",  # faster-whisper passes av.open() an argument that PyAV 19 removed
]

[project.urls]
Homepage = "https://github.com/evanpersinger/file-converter"
Repository = "https://github.com/evanpersinger/file-converter"

[tool.hatch.build.targets.wheel]
packages = []
# Flatten backend/ back to the top level in the built wheel, so the scripts' flat
# imports (`from md_pdf import ...`) keep resolving after the backend/ reorg.
sources = ["backend"]
include = ["backend/*.py"]

[tool.hatch.build.targets.sdist]
include = ["backend/*.py", "pyproject.toml", "README.md"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# The converter scripts import each other flat (`from md_pdf import ...`), matching the
# wheel layout where backend/ is flattened to the top level. Putting backend/ on the
# path lets the tests import them the same way instead of through a package prefix.
testpaths = ["backend/tests"]
pythonpath = ["backend"]
